name: Deploy Culinary Intelligence App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate culinary knowledge base & referential integrity
        run: npm run validate:data

      - name: Run static contract & type checks
        run: npm run typecheck

      - name: Run unit and integration test suite
        run: npm run test

      - name: Run performance benchmark suite
        run: npm run benchmark

      - name: Build static production bundle for GitHub Pages
        run: npm run build

      - name: Verify GitHub Pages subpath HTTP and relative asset resolution
        run: npm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
